<nav
  [class]="
    isScrolled
      ? 'fixed w-full z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-lg transition-all duration-300'
      : 'fixed w-full z-50 bg-white dark:bg-slate-900 transition-all duration-300'
  "
>
  <!-- Scroll Progress Bar -->
  <div class="absolute top-0 left-0 h-1 bg-gradient-to-r from-blue-600 via-blue-500 to-slate-600 transition-all duration-300 ease-out" [style.width.%]="scrollProgress"></div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 py-3">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="#home" (click)="scrollToSection($event, '#home')" class="flex items-center gap-3 group">
          <div class="relative w-12 h-12 flex items-center justify-center group-hover:scale-105 transition-all duration-300">
            <!-- Main terminal container -->
            <div class="relative w-full h-full bg-gradient-to-br from-blue-900 to-slate-700 rounded-lg flex items-center justify-center shadow-md group-hover:shadow-lg transition-all duration-300 border border-blue-800/30">

              <!-- Terminal prompt symbol with blinking cursor -->
              <div class="flex items-center gap-0.5 font-mono font-semibold text-lg">
                <span class="text-blue-300">&gt;</span>
                <span class="text-slate-300">_</span>
                <span class="inline-block w-2 h-4 bg-blue-400 animate-blink"></span>
              </div>
            </div>
          </div>

          <span class="text-gray-900 dark:text-white font-bold text-xl hidden sm:block group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-300">
            DevFolio
          </span>
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-1">
        <a
          *ngFor="let item of menuItems"
          [href]="item.href"
          (click)="scrollToSection($event, item.href)"
          class="relative px-3 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-200 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:duration-300"
        >
          {{ item.label }}
        </a>

        <!-- Dark Mode Toggle -->
        <button
          (click)="toggleTheme()"
          class="ml-4 p-2 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors duration-200"
          aria-label="Toggle dark mode"
        >
          <!-- Sun Icon (shown in dark mode) -->
          <svg
            *ngIf="themeService.isDarkMode()"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-yellow-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg
            *ngIf="!themeService.isDarkMode()"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-slate-700"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>
      </div>

      <!-- Mobile menu button & Dark Mode Toggle -->
      <div class="flex md:hidden items-center gap-2">
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors duration-200"
          aria-label="Toggle dark mode"
        >
          <svg
            *ngIf="themeService.isDarkMode()"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-yellow-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            *ngIf="!themeService.isDarkMode()"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-slate-700"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>

        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            *ngIf="!isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            *ngIf="isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div
      class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
      [class.max-h-0]="!isMobileMenuOpen"
      [class.max-h-96]="isMobileMenuOpen"
      [class.opacity-0]="!isMobileMenuOpen"
      [class.opacity-100]="isMobileMenuOpen"
    >
      <div class="px-2 pt-4 pb-6 space-y-2 bg-gradient-to-b from-gray-50 to-white dark:from-slate-800 dark:to-slate-900 rounded-b-2xl shadow-lg">
        <a
          *ngFor="let item of menuItems; let i = index"
          [href]="item.href"
          (click)="scrollToSection($event, item.href)"
          class="group relative block px-4 py-3 rounded-xl text-base font-medium text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200 overflow-hidden"
          [style.animation-delay]="(i * 50) + 'ms'"
        >
          <!-- Hover background effect -->
          <div class="absolute inset-0 bg-gradient-to-r from-blue-50 to-cyan-50 dark:from-blue-900/20 dark:to-cyan-900/20 opacity-0 group-hover:opacity-100 transition-opacity duration-200 rounded-xl"></div>

          <!-- Content -->
          <div class="relative flex items-center justify-between">
            <span>{{ item.label }}</span>
            <svg class="w-5 h-5 text-gray-400 dark:text-gray-600 group-hover:text-blue-600 dark:group-hover:text-blue-400 transform group-hover:translate-x-1 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </a>
      </div>
    </div>
  </div>
</nav>
