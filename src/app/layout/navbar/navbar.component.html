<nav
  [class]="
    isScrolled
      ? 'fixed w-full z-50 bg-white/80 backdrop-blur-sm shadow-sm transition-all duration-300'
      : 'fixed w-full z-50 bg-white transition-all duration-300'
  "
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="/" class="text-gray-800 font-semibold text-xl">
          DevFolio | Adrián Talavera
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="text-blue-600 after:content-[''] after:block after:w-full after:h-0.5 after:bg-blue-600 after:scale-x-100"
          [routerLinkActiveOptions]="{ exact: true }"
          class="relative text-gray-600 hover:text-gray-900 py-2 text-sm font-medium transition-colors duration-200 after:content-[''] after:block after:w-full after:h-0.5 after:bg-blue-600 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:duration-300"
        >
          {{ item.label }}
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="flex md:hidden">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
        >
          <span class="sr-only">Open main menu</span>
          <!-- Menu icon -->
          <svg
            *ngIf="!isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <!-- Close icon -->
          <svg
            *ngIf="isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div class="md:hidden" [class.hidden]="!isMobileMenuOpen">
      <div class="px-2 pt-2 pb-3 space-y-1">
        <a
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="text-blue-600 bg-blue-50"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="toggleMobileMenu()"
          class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors duration-200"
        >
          {{ item.label }}
        </a>
      </div>
    </div>
  </div>
</nav>
