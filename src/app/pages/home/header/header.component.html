<section id="home"
  class="min-h-screen flex items-center bg-[#0f172b] transition-colors duration-300 pt-16 relative overflow-hidden">

  <!-- Fondo Dinámico Ultra-Moderno — Sincronizado con #0f172b -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <!-- Blobs Líquidos de Alta Fidelidad -->
    <!-- Blob 1: Top Right - Slate 800/900 mix -->
    <div
      class="absolute top-[-10%] right-[-10%] w-[800px] h-[800px] bg-slate-800/30 rounded-full blur-[120px] animate-blob">
    </div>

    <!-- Blob 2: Bottom Left - Blue 900 variation -->
    <div
      class="absolute bottom-[-10%] left-[-15%] w-[900px] h-[900px] bg-blue-900/20 rounded-full blur-[140px] animate-blob-delayed">
    </div>

    <!-- Blob 3: Center Left - Indigo 950 -->
    <div
      class="absolute top-[10%] left-[5%] w-[600px] h-[600px] bg-indigo-950/40 rounded-full blur-[100px] animate-blob-slow">
    </div>

    <!-- Blob 4: Center Right - Deep Navy -->
    <div
      class="absolute bottom-[20%] right-[5%] w-[700px] h-[700px] bg-slate-800/25 rounded-full blur-[120px] animate-blob"
      style="animation-delay: -5s;"></div>

    <!-- Malla de Referencia tecnológica casi invisible -->
    <div class="absolute inset-0 opacity-[0.04]"
      style="background-image: radial-gradient(#1e293b 1.5px, transparent 1.5px); background-size: 60px 60px;">
    </div>

    <!-- Degradado de Profundidad Final -->
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#0f172b]/50 to-[#0f172b]"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-20 w-full relative z-10">
    <div class="flex flex-col lg:grid lg:grid-cols-2 gap-4 lg:gap-6 items-center">

      <!-- Información principal -->
      <div class="order-1 lg:order-none text-center lg:text-left space-y-4 lg:space-y-6 animate-fade-in w-full">
        <div class="inline-block">
          <span class="text-blue-400 dark:text-blue-500 font-bold text-lg tracking-widest uppercase">
            👋 Hola, soy
          </span>
        </div>

        <h1 class="text-4xl sm:text-6xl lg:text-7xl font-bold text-white leading-tight drop-shadow-sm">
          Adrián Talavera
        </h1>

        <h2
          class="text-xl sm:text-3xl lg:text-4xl font-bold bg-gradient-to-r from-blue-100 via-white to-blue-200 bg-clip-text text-transparent tracking-tight animate-shine">
          <span class="inline-block">{{ displayedTitle }}<span
              class="inline-block w-0.5 h-6 lg:h-8 bg-white ml-1 align-middle animate-blink"></span></span>
        </h2>
      </div>

      <!-- Foto de Perfil -->
      <div class="order-2 lg:order-none lg:row-span-4 relative animate-fade-in w-full">
        <div class="relative group">
          <div class="relative aspect-square max-w-[220px] sm:max-w-sm mx-auto">
            <!-- Aura de profundidad #0f172b -->
            <div
              class="absolute -inset-6 bg-blue-500/5 rounded-full blur-3xl group-hover:bg-blue-500/10 transition-colors duration-700">
            </div>
            <div class="absolute -inset-3 border border-slate-700/50 rounded-2xl"></div>
            <div
              class="relative rounded-2xl overflow-hidden shadow-2xl transition-all duration-700 hover:scale-[1.03] hover:shadow-blue-900/20">
              <img src="assets/images/foto_perfil_linkedin.PNG" alt="Adrián Talavera - .NET Developer"
                class="w-full h-full object-cover" />
            </div>
            <!-- Detalles de bordes refinados -->
            <div class="absolute -bottom-2 -right-2 w-16 h-16 border-r-2 border-b-2 border-blue-600/30 rounded-br-2xl">
            </div>
            <div class="absolute -top-2 -left-2 w-16 h-16 border-l-2 border-t-2 border-slate-600/30 rounded-tl-2xl">
            </div>
          </div>
        </div>
      </div>

      <!-- Descripción -->
      <div class="order-3 lg:order-none text-center lg:text-left animate-fade-in w-full">
        <p class="text-base sm:text-xl text-slate-300 max-w-xl mx-auto lg:mx-0 leading-relaxed drop-shadow-sm">
          Especialista en el desarrollo de software <span
            class="font-bold bg-gradient-to-r from-white to-blue-300 bg-clip-text text-transparent">
            eficiente y escalable</span> dentro del <span class="font-semibold text-blue-400">ecosistema .NET</span>.
        </p>
      </div>

      <!-- CTAs -->
      <div class="order-4 lg:order-none text-center lg:text-left w-full mt-2 lg:mt-0">
        <div class="flex flex-col sm:flex-row items-center gap-4 justify-center lg:justify-start">
          <a href="#projects"
            class="group px-8 py-4 bg-gradient-to-r from-blue-900 to-slate-600 text-white rounded-lg font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200 w-full sm:w-auto flex items-center justify-center gap-2">
            <span>Ver Proyectos</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform duration-200" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>
          <a [href]="cvUrl" target="_blank"
            class="group px-8 py-4 bg-slate-800/80 border border-slate-700 text-slate-200 rounded-xl font-bold hover:bg-slate-700 transition-all duration-300 w-full sm:w-auto flex items-center justify-center gap-2">
            <svg class="w-5 h-5 group-hover:translate-y-0.5 transition-transform duration-300" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span>Descargar CV</span>
          </a>
        </div>
      </div>

      <!-- Social Links (Elegancia Suprema) -->
      <div class="order-5 lg:order-none w-full mt-10 sm:mt-14">
        <div class="flex flex-col items-center lg:items-start gap-3 sm:gap-5">
          <span class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] animate-fade-in-up">
            Encuéntrame en:
          </span>
          <div
            class="flex items-center justify-center lg:justify-start gap-3 sm:gap-5 animate-fade-in-up animate-delay-200">
            <a href="https://www.linkedin.com/in/adriantalavera-dev/" target="_blank" rel="noopener noreferrer"
              class="p-2.5 bg-slate-800/50 border border-slate-700 text-slate-400 hover:text-blue-400 hover:border-blue-500/50 transition-all duration-400 rounded-xl shadow-inner hover:-translate-y-1"
              aria-label="LinkedIn">
              <svg class="w-4.5 h-4.5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
              </svg>
            </a>
            <a href="https://github.com/atalavera21" target="_blank" rel="noopener noreferrer"
              class="p-2.5 bg-slate-800/50 border border-slate-700 text-slate-400 hover:text-white hover:border-white/50 transition-all duration-400 rounded-xl shadow-inner hover:-translate-y-1"
              aria-label="GitHub">
              <svg class="w-4.5 h-4.5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
              </svg>
            </a>
            <a href="mailto:atalavera.0596@gmail.com"
              class="p-2.5 bg-slate-800/50 border border-slate-700 text-slate-400 hover:text-red-400 hover:border-red-500/50 transition-all duration-400 rounded-xl shadow-inner hover:-translate-y-1"
              aria-label="Email">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 animate-bounce hidden lg:block z-20">
    <a href="#about" class="text-slate-500 hover:text-white transition-colors duration-300">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
      </svg>
    </a>
  </div>
</section>
